{% extends "base.html" %}

{% block title %}Tạo tài khoản - {{ app_name }}{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth-intro">
    <h1 class="auth-title">Tạo tài khoản phụ huynh</h1>
    <p class="lede">Tạo tài khoản để quản lý hồ sơ và thiết bị của gia đình mình.</p>
  </div>
  <div class="panel auth-form">
    {% if error %}<p class="notice notice-error section-inset" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/register" class="stack-sm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="displayName">Tên hiển thị</label>
        <input class="input" id="displayName" name="display_name" autocomplete="name" maxlength="60" value="{{ display_name }}" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" type="email" name="email" autocomplete="username" maxlength="254" value="{{ email }}" required>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input class="input" id="password" type="password" name="password" autocomplete="new-password" minlength="10" maxlength="128" aria-describedby="passwordHelp" required>
        <small id="passwordHelp" class="muted">Từ 10 đến 128 ký tự.</small>
      </div>
      <div class="field">
        <label for="passwordConfirmation">Nhập lại mật khẩu</label>
        <input class="input" id="passwordConfirmation" type="password" name="password_confirmation" autocomplete="new-password" minlength="10" maxlength="128" required>
      </div>
      <button type="submit" class="btn">Tạo tài khoản</button>
      <a class="btn btn-quiet" href="/login">Quay lại đăng nhập</a>
    </form>
  </div>
</div>
{% endblock %}
