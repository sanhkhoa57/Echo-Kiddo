[alembic]
script_location = %(here)s/migrations
# URL lay tu bien moi truong OGK_DATABASE_URL (xem migrations/env.py)

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
